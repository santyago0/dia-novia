<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/photos.css" />
    <link rel="icon" href="img/flowers.png" type="image/x-icon" />
    <title>Nuestras Fotos</title>
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">Nuestros Momentos</h1>
      <p class="header__subtitle">Cada foto cuenta una historia de nosotros</p>
    </header>

    <main class="gallery">
      <figure class="photo-card" data-anim="fade-up">
        <img
          src="https://images.pexels.com/photos/9451314/pexels-photo-9451314.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja con rosas"
          crossorigin="anonymous"
        />
        <figcaption>Un detalle que dice mil cosas</figcaption>
      </figure>

      <figure class="photo-card" data-anim="slide-left">
        <img
          src="https://images.pexels.com/photos/32439850/pexels-photo-32439850.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja al atardecer"
          crossorigin="anonymous"
        />
        <figcaption>Atardeceres que contigo son mejores</figcaption>
      </figure>

      <figure class="photo-card" data-anim="slide-right">
        <img
          src="https://images.pexels.com/photos/29823310/pexels-photo-29823310.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja abrazándose"
          crossorigin="anonymous"
        />
        <figcaption>El mejor lugar del mundo es a tu lado</figcaption>
      </figure>

      <figure class="photo-card" data-anim="zoom-in">
        <img
          src="https://images.pexels.com/photos/37091991/pexels-photo-37091991.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja bajo un árbol"
          crossorigin="anonymous"
        />
        <figcaption>Momentos tranquilos que valen oro</figcaption>
      </figure>

      <figure class="photo-card" data-anim="fade-up">
        <img
          src="https://images.pexels.com/photos/17548941/pexels-photo-17548941.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja abrazo luz roja"
          crossorigin="anonymous"
        />
        <figcaption>La luz de tu sonrisa ilumina todo</figcaption>
      </figure>

      <figure class="photo-card" data-anim="slide-left">
        <img
          src="https://images.pexels.com/photos/27946348/pexels-photo-27946348.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Pareja feliz"
          crossorigin="anonymous"
        />
        <figcaption>Y así seguimos, siempre juntos</figcaption>
      </figure>

      <figure class="photo-card" data-anim="slide-right">
        <img
          src="https://images.pexels.com/photos/38485139/pexels-photo-38485139.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Rosas rojas"
          crossorigin="anonymous"
        />
        <figcaption>Flores para ti, siempre</figcaption>
      </figure>

      <figure class="photo-card" data-anim="zoom-in">
        <img
          src="https://images.pexels.com/photos/13306125/pexels-photo-13306125.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Ramo de rosas"
          crossorigin="anonymous"
        />
        <figcaption>Un ramo de razones para quererte</figcaption>
      </figure>

      <figure class="photo-card" data-anim="fade-up">
        <img
          src="https://images.pexels.com/photos/29964169/pexels-photo-29964169.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Rosas en la nieve"
          crossorigin="anonymous"
        />
        <figcaption>Incluso en el frío, tu amor me calienta</figcaption>
      </figure>

      <figure class="photo-card" data-anim="slide-left">
        <img
          src="https://images.pexels.com/photos/35568784/pexels-photo-35568784.jpeg?auto=compress&cs=tinysrgb&h=650&w=940"
          alt="Rosas con respiración"
          crossorigin="anonymous"
        />
        <figcaption>Cada flor es un te quiero más</figcaption>
      </figure>
    </main>

    <div class="download-zone" id="downloadZone">
      <p class="download-zone__text">
        Has llegado al final de nuestro recorrido. Llévate un recuerdo de hoy.
      </p>
      <button class="download-btn" id="downloadBtn">
        Descargar collage "Feliz Día de la Novia"
      </button>
    </div>

    <canvas id="collageCanvas" style="display: none"></canvas>

    <script src="photos.js"></script>
  </body>
</html>
