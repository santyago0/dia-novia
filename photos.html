<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/photos.css" />
  <link rel="icon" href="img/flowers.png" type="image/x-icon" />
  <title>Nuestras Fotos</title>
</head>

<body>
  <header class="header">
    <h1 class="header__title">Te AMO mi Niña ❤️‍🔥</h1>
    <p class="header__subtitle">Gracias por hacerme feliz y acompañarme en cada momento</p>
  </header>

  <main class="gallery">
    <figure class="photo-card" data-anim="slide-left">
      <img src="img/corazon_piscina.jpeg" alt="corazon_piscina.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="zoom-in">
      <img src="img/foto_perfil.jpeg" alt="foto_perfil.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="flip-in">
      <img src="img/outfit_halloween.jpeg" alt="outfit_halloween.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="fade-up">
      <img src="img/regalo_flores.jpeg" alt="regalo_flores.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="soft-rotate">
      <img src="img/mascarillas_pijamada.jpeg" alt="mascarillas_pijamada.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="fade-up">
      <img src="img/camisa_real_madrid.jpeg" alt="camisa_real_madrid.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="slide-right">
      <img src="img/dia_vino.jpeg" alt="dia_vino.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="fade-up">
      <img src="img/hermosa.jpeg" alt="hermosa.jpeg" />
    </figure>

    <figure class="photo-card" data-anim="slide-right">
      <img src="img/ojazos.jpeg" alt="ojazos.jpeg" />
    </figure>
  </main>

  <div class="download-zone" id="downloadZone">
    <p class="download-zone__text">
      Y para terminar le dejo un pequeño detalle.
    </p>
    <button class="download-btn" id="downloadBtn">
      Sorpresita 🎁
    </button>
  </div>

  <canvas id="collageCanvas" style="display: none"></canvas>

  <script src="photos.js"></script>
</body>

</html>
